<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administrador - Radio Escolar FM</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Socket.io -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <!-- Estilos -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Modal de Login -->
    <div id="loginModal" class="login-modal">
        <div class="login-container">
            <div class="login-header">
                <i class="fas fa-user-shield"></i>
                <h2>Panel de Administrador</h2>
                <p>Iniciar Sesión</p>
            </div>
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" required autocomplete="off" placeholder="ADMINISTRADOR">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required placeholder="987654321">
                </div>
                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i>
                    Entrar
                </button>
            </form>
            <div id="loginError" class="login-error hidden"></div>
            <a href="/" class="back-link">
                <i class="fas fa-arrow-left"></i> Volver a la Radio
            </a>
        </div>
    </div>

    <!-- Contenedor principal del Admin -->
    <div class="app-container" id="mainContainer" style="display: none;">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <i class="fas fa-user-shield"></i>
                <span>Panel de Administrador</span>
            </div>
            <div class="header-right">
                <div class="live-badge">
                    <span class="pulse"></span>
                    EN VIVO
                </div>
                <button id="logoutBtn" class="logout-btn" title="Cerrar Sesión">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </header>

        <!-- Panel Principal -->
        <main class="player-container">
            <!-- Visualizador de Ondas -->
            <canvas id="visualizer" height="60"></canvas>

            <!-- Control de volumen y micrófono -->
            <div class="controls-wrapper">
                <button id="micBtn" class="mic-btn" title="Mantener para hablar">
                    <i class="fas fa-microphone"></i>
                </button>

                <div class="volume-container">
                    <button id="muteBtn" class="volume-btn" title="Silenciar">
                        <i class="fas fa-volume-high"></i>
                    </button>
                    <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="75">
                    <span id="volumeValue" class="volume-value">75%</span>
                </div>
            </div>
        </main>

        <!-- Stats en tiempo real -->
        <section class="stats-section">
            <div class="stat-card">
                <i class="fas fa-headphones"></i>
                <div class="stat-info">
                    <span id="listenersCount" class="stat-value">0</span>
                    <span class="stat-label">Oyentes</span>
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>Radio Escolar FM - Panel de Administrador</p>
        </footer>
    </div>

    <!-- JavaScript -->
    <script src="js/admin.js"></script>
</body>

</html>
