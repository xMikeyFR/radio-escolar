<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Escolar FM</title>
    <meta name="description" content="Estación de Radio Web Escolar - Música 24/7">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Socket.io -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <!-- Estilos -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Modal de Login -->
    <div id="loginModal" class="login-modal">
        <div class="login-container">
            <div class="login-header">
                <i class="fas fa-radio"></i>
                <h2>Radio Escolar FM</h2>
                <p>Iniciar Sesión</p>
            </div>
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i>
                    Entrar
                </button>
                <p class="login-hint">Ingresa como oyente sin credenciales</p>
                <button type="button" id="guestBtn" class="guest-btn">Continuar como Oyente</button>
            </form>
            <div id="loginError" class="login-error hidden"></div>
        </div>
    </div>

    <!-- Contenedor principal -->
    <div class="app-container" id="mainContainer" style="display: none;">

        <!-- Header -->
        <header class="header">
            <div class="logo">
                <i class="fas fa-radio"></i>
                <span>Radio Escolar FM</span>
            </div>
            <div class="header-right">
                <div class="live-badge">
                    <span class="pulse"></span>
                    EN VIVO
                </div>
                <button id="logoutBtn" class="logout-btn hidden" title="Cerrar Sesión">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </header>

        <!-- Panel Principal -->
        <main class="player-container">
            <!-- Visualizador de Ondas (solo para admin) -->
            <canvas id="visualizer" height="60"></canvas>

            <!-- Control de volumen y micrófono -->
            <div class="controls-wrapper">
                <button id="micBtn" class="mic-btn hidden" title="Mantener para hablar">
                    <i class="fas fa-microphone"></i>
                </button>

                <div class="volume-container">
                    <button id="muteBtn" class="volume-btn" title="Silenciar">
                        <i class="fas fa-volume-high"></i>
                    </button>
                    <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="75">
                    <span id="volumeValue" class="volume-value">75%</span>
                </div>
            </div>
        </main>

        <!-- Stats en tiempo real -->
        <section class="stats-section">
            <div class="stat-card">
                <i class="fas fa-headphones"></i>
                <div class="stat-info">
                    <span id="listenersCount" class="stat-value">0</span>
                    <span class="stat-label">Oyentes</span>
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>Radio Escolar FM - Proyecto de Aplicaciones Web Orientadas a Servicios</p>
        </footer>
    </div>

    <!-- JavaScript -->
    <script src="js/app.js"></script>
</body>

</html>
