<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Escolar FM</title>
    <meta name="description" content="Estación de Radio Web Escolar - Solo Voz">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Socket.io -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <!-- Estilos -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Contenedor principal - SOLO PARA OYENTES -->
    <div class="app-container" id="mainContainer">

        <!-- Header -->
        <header class="header">
            <div class="logo">
                <i class="fas fa-radio"></i>
                <span>Radio Escolar FM</span>
            </div>
            <div class="header-right">
                <div class="live-badge">
                    <span class="pulse"></span>
                    EN VIVO
                </div>
            </div>
        </header>

        <!-- Panel Principal -->
        <main class="player-container">
            <!-- Visualizador de Ondas -->
            <canvas id="visualizer" height="60"></canvas>

            <!-- Botón Escuchar (solo móvil - necesario para autoplay en iOS/Android) -->
            <button id="playBtn" class="play-btn" type="button">
                <i class="fas fa-play"></i> Toca para escuchar
            </button>
            <!-- Control de volumen -->
            <div class="controls-wrapper">
                <div class="volume-container">
                    <button id="muteBtn" class="volume-btn" title="Silenciar">
                        <i class="fas fa-volume-high"></i>
                    </button>
                    <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="75">
                    <span id="volumeValue" class="volume-value">75%</span>
                </div>
            </div>
        </main>

        <!-- Stats en tiempo real -->
        <section class="stats-section">
            <div class="stat-card">
                <i class="fas fa-headphones"></i>
                <div class="stat-info">
                    <span id="listenersCount" class="stat-value">0</span>
                    <span class="stat-label">Oyentes</span>
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>Radio Escolar FM - Proyecto de Aplicaciones Web Orientadas a Servicios</p>
        </footer>
    </div>

    <!-- JavaScript -->
    <script src="js/app.js"></script>
</body>

</html>
